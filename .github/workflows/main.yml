<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Numan Khan | Birthday Celebration</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 overflow-x:hidden;
 color:#fff;
 font-family:Arial,sans-serif;
 text-align:center;
 background:radial-gradient(ellipse at top,#28204c,#100d24 55%,#05040d);
}

.stars{
 position:fixed;inset:0;pointer-events:none;
 background-image:
 radial-gradient(2px 2px at 20% 30%,white,transparent),
 radial-gradient(2px 2px at 70% 20%,#f9d77e,transparent),
 radial-gradient(2px 2px at 40% 80%,white,transparent),
 radial-gradient(2px 2px at 90% 60%,#a9a4ff,transparent);
 background-size:180px 180px;
 animation:twinkle 4s infinite alternate;
}
@keyframes twinkle{to{opacity:.25}}

header{
 position:relative;
 z-index:2;
 padding:25px;
 color:#f5d58b;
 letter-spacing:5px;
 font-size:14px;
}

main{
 position:relative;
 z-index:2;
 padding:35px 18px 70px;
}

.tag{
 display:inline-block;
 padding:10px 22px;
 border:1px solid #e9c477;
 border-radius:30px;
 color:#f8d993;
 letter-spacing:3px;
 font-size:11px;
}

h1{
 font-size:clamp(34px,7vw,68px);
 margin:25px 0 12px;
 background:linear-gradient(90deg,#fff,#f5cf75,#fff);
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{
 color:#c5c0db;
 line-height:1.8;
}

.clock-card{
 max-width:650px;
 margin:35px auto;
 padding:30px 15px;
 background:#ffffff0b;
 border:1px solid #ffffff24;
 border-radius:25px;
 backdrop-filter:blur(15px);
 box-shadow:0 15px 55px #0008;
}

.clock-title{
 color:#f4d48e;
 letter-spacing:4px;
 font-size:12px;
}

#clock{
 font-size:clamp(35px,9vw,60px);
 font-weight:bold;
 margin:18px 0;
 color:#fff;
 text-shadow:0 0 25px #e8bc65;
}

#date{color:#c9c4df;font-size:14px}

.countdown{
 display:flex;
 justify-content:center;
 gap:12px;
 margin-top:25px;
 flex-wrap:wrap;
}

.unit{
 background:#ffffff0c;
 border:1px solid #ffffff1c;
 border-radius:13px;
 padding:15px;
 min-width:75px;
}

.unit strong{
 display:block;
 font-size:27px;
 color:#f7d58d;
}

.unit small{
 font-size:10px;
 color:#bcb7d2;
 letter-spacing:2px;
}

.cake-area{
 margin:45px auto 30px;
 perspective:700px;
}

.cake{
 font-size:110px;
 display:inline-block;
 filter:drop-shadow(0 0 25px #f3bd5a88);
 animation:float 3s ease-in-out infinite;
}

@keyframes float{
 50%{transform:translateY(-15px) rotateY(12deg)}
}

.message{
 max-width:650px;
 margin:35px auto;
 padding:30px 22px;
 border:1px solid #d6b56a55;
 border-radius:20px;
 background:linear-gradient(135deg,#ffffff12,#ffffff04);
 line-height:2;
 color:#eee8fa;
}

.message h2{
 color:#f7d58d;
 margin-bottom:15px;
}

button{
 border:0;
 border-radius:30px;
 padding:16px 28px;
 background:linear-gradient(120deg,#f6d78d,#c28b38);
 color:#20152c;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 5px 25px #e6b75c44;
 transition:.3s;
}

button:hover{transform:scale(1.07)}

#surprise{display:none}
#surprise.show{
 display:block;
 animation:appear 1.5s ease;
}

@keyframes appear{
 from{opacity:0;transform:translateY(30px) scale(.9)}
 to{opacity:1;transform:translateY(0) scale(1)}
}

#surprise h2{
 font-size:clamp(30px,7vw,52px);
 color:#ffdb8b;
 margin:30px 0;
 text-shadow:0 0 25px #f7c45a;
}

#effects{
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:10;
 overflow:hidden;
}

.particle{
 position:absolute;
 top:-30px;
 animation:fall linear forwards;
}

@keyframes fall{
 to{
  transform:translateY(110vh) rotate(720deg);
  opacity:0;
 }
}

footer{
 position:relative;
 z-index:2;
 padding:30px;
 color:#a9a3c1;
 font-size:12px;
 letter-spacing:3px;
}

@media(max-width:480px){
 main{padding-top:20px}
 .unit{min-width:65px;padding:12px 8px}
}
</style>
</head>

<body>

<div class="stars"></div>
<div id="effects"></div>

<header>✦ EROOR TEAM PRESENTS ✦</header>

<main>

<div class="tag">A SPECIAL CELEBRATION</div>

<h1>Birthday Surprise</h1>

<p class="subtitle">
A special day is waiting for a special person.
</p>

<section class="clock-card">

<div class="clock-title">LIVE PAKISTAN TIME</div>

<div id="clock">00:00:00</div>

<div id="date">Loading...</div>

<div id="timer-area">

<p style="color:#f7d58d;margin-top:25px;letter-spacing:3px">
COUNTDOWN TO MIDNIGHT
</p>

<div class="countdown">

<div class="unit">
<strong id="days">00</strong>
<small>DAYS</small>
</div>

<div class="unit">
<strong id="hours">00</strong>
<small>HOURS</small>
</div>

<div class="unit">
<strong id="minutes">00</strong>
<small>MINUTES</small>
</div>

<div class="unit">
<strong id="seconds">00</strong>
<small>SECONDS</small>
</div>

</div>
</div>
</section>

<div class="cake-area">
<div class="cake">🎂</div>
<p style="color:#f7d58d;letter-spacing:3px">
MADE WITH LOVE
</p>
</div>

<section class="message">

<h2>Dear Mr Numan Khan ❤️</h2>

<p>
Some people make life more beautiful just by being
part of it. Today is all about celebrating you!
</p>

<p style="margin-top:15px;color:#f7d58d">
May your life always be full of happiness,
success, peace and beautiful memories.
</p>

</section>

<section id="surprise">

<div style="font-size:65px">🎉🎊🎁</div>

<h2>HAPPY BIRTHDAY!</h2>

<h1 style="font-size:clamp(32px,7vw,55px)">
MR NUMAN KHAN
</h1>

<div class="message">

<h2>Many Many Happy Returns! ❤️</h2>

<p>
Wishing you a wonderful birthday!
May every new day bring new opportunities,
success, happiness and countless reasons to smile.

Keep shining, keep growing and keep enjoying life!
</p>

<h2 style="margin-top:25px">WITH BEST WISHES</h2>

<p style="font-size:30px;color:#f7d58d">
EROOR TEAM ❤️
</p>

</div>

<div style="font-size:55px">🥳🎂✨</div>

</section>

<button id="gift" onclick="openGift()">
🎁 OPEN YOUR SPECIAL GIFT
</button>

<p style="margin-top:22px;color:#aaa4c4;font-size:12px">
A little surprise made especially for you.
</p>

</main>

<footer>
MADE WITH ❤️ BY EROOR TEAM
<p style="margin-top:12px">SPECIAL BIRTHDAY EDITION • 2026</p>
</footer>

<script>

const zone="Asia/Karachi";

const formatter=new Intl.DateTimeFormat("en-GB",{
 timeZone:zone,
 year:"numeric",
 month:"2-digit",
 day:"2-digit",
 hour:"2-digit",
 minute:"2-digit",
 second:"2-digit",
 hourCycle:"h23"
});

function pakistanNow(){

 const parts=Object.fromEntries(
  formatter.formatToParts(new Date())
  .filter(p=>p.type!=="literal")
  .map(p=>[p.type,p.value])
 );

 return {
  year:+parts.year,
  month:+parts.month,
  day:+parts.day,
  hour:+parts.hour,
  minute:+parts.minute,
  second:+parts.second
 };
}

function getTarget(){

 const p=pakistanNow();

 return new Date(Date.UTC(
  p.year,p.month-1,p.day+1,0,0,0
 ));
}

let target=getTarget();
let celebrated=false;

function update(){

 const p=pakistanNow();

 const now=new Date(Date.UTC(
  p.year,p.month-1,p.day,
  p.hour,p.minute,p.second
 ));

 document.getElementById("clock").textContent=
 [p.hour,p.minute,p.second]
 .map(x=>String(x).padStart(2,"0")).join(":");

 document.getElementById("date").textContent=
 `${String(p.day).padStart(2,"0")}-${String(p.month).padStart(2,"0")}-${p.year} • Pakistan Time`;

 let diff=Math.max(0,target-now);

 const total=Math.floor(diff/1000);

 const d=Math.floor(total/86400);
 const h=Math.floor(total%86400/3600);
 const m=Math.floor(total%3600/60);
 const s=total%60;

 ["days","hours","minutes","seconds"].forEach((id,i)=>{
  document.getElementById(id).textContent=
  String([d,h,m,s][i]).padStart(2,"0");
 });

 if(diff===0&&!celebrated){
  celebrated=true;
  celebrate();
 }

}

function celebrate(){

 document.getElementById("timer-area").innerHTML=
 "<h2 style='color:#ffdb8b;margin-top:25px'>🎉 IT'S YOUR SPECIAL DAY! 🎉</h2>";

 document.getElementById("surprise").classList.add("show");

 document.getElementById("gift").style.display="none";

 fireworks();
}

function openGift(){

 document.getElementById("surprise").classList.add("show");

 document.getElementById("gift").style.display="none";

 fireworks();
}

function fireworks(){

 const area=document.getElementById("effects");

 const symbols=["✨","🎉","🎊","💖","⭐","🎈"];

 for(let i=0;i<100;i++){

  const el=document.createElement("span");

  el.className="particle";

  el.textContent=symbols[
   Math.floor(Math.random()*symbols.length)
  ];

  el.style.left=Math.random()*100+"%";

  el.style.animationDuration=
  (2+Math.random()*4)+"s";

  el.style.fontSize=
  (14+Math.random()*20)+"px";

  area.appendChild(el);

  setTimeout(()=>el.remove(),6500);
 }

}

update();
setInterval(update,1000);

</script>

</body>
</html>
